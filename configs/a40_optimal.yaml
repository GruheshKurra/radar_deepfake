img_size: 224
patch_size: 16
embed_dim: 384
evidence_dim: 128
reasoning_iterations: 3
reasoning_heads: 4
fft_size: 112
dropout: 0.1
gating_init: 0.5

batch_size: 128
num_epochs: 30
learning_rate: 0.001
weight_decay: 0.05
gradient_accumulation_steps: 1
warmup_ratio: 0.1
freeze_backbone_epochs: 3

num_workers: 8
prefetch_factor: 4
pin_memory: true
persistent_workers: true

lambda_main: 1.0
lambda_branch: 0.3
lambda_orthogonal: 0.01
lambda_deep_supervision: 0.05
label_smoothing: 0.05
orthogonality_margin: 0.1

early_stopping_patience: 10

train_ratio: 0.7
val_ratio: 0.15
seed: 42

source_domain: "faceforensics"
