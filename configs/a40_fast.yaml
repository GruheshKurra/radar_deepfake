img_size: 224
patch_size: 16
embed_dim: 384
evidence_dim: 128
reasoning_iterations: 3
reasoning_heads: 4
fft_size: 112
dropout: 0.1
gating_init: 0.5

batch_size: 256
num_epochs: 10
learning_rate: 0.002
weight_decay: 0.05
gradient_accumulation_steps: 1
warmup_ratio: 0.05
freeze_backbone_epochs: 2

num_workers: 8
prefetch_factor: 6
pin_memory: true
persistent_workers: true

lambda_main: 1.0
lambda_branch: 0.3
lambda_orthogonal: 0.01
lambda_deep_supervision: 0.05
label_smoothing: 0.05
orthogonality_margin: 0.1

early_stopping_patience: 5

train_ratio: 0.7
val_ratio: 0.15
subset_ratio: 0.5
seed: 42

source_domain: "faceforensics"
